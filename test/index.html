<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Paper-easy · 交互测试夹具</title>
<link rel="stylesheet" href="/styles.css">
<style>
:root { --background-primary:#fff; --background-secondary:#f5f5f3; --background-modifier-border:#d9ddd8; --background-modifier-hover:#eef1ed; --text-normal:#28352d; --text-muted:#66716a; --text-faint:#87938a; --text-accent:#466751; --interactive-accent:#466751; }
body { margin:0; padding:30px; background:#e9ece8; font-family:system-ui,sans-serif; }
button,input { font:inherit; color:var(--text-normal); background:var(--background-primary); border:1px solid var(--background-modifier-border); border-radius:5px; }
button { cursor:pointer; }
.workspace-leaf-content { position:relative; width:660px; background:white; padding:18px; box-sizing:border-box; }
.view-actions { display:flex; gap:8px; justify-content:flex-end; height:30px; }
.view-actions button { width:28px; }
.page { position:relative; height:620px; }
.page canvas { position:absolute; inset:0; width:600px; height:620px; }
.textLayer { position:relative; padding:45px 25px; font:18px/1.8 Georgia,serif; }
.textLayer h1 { font:30px/1.3 Georgia,serif; }
#sidebar { position:absolute; left:725px; top:30px; width:310px; background:white; border-radius:8px; padding:12px; }
.fixture-label { font-size:12px; color:#66716a; margin-bottom:14px; }
.clickable-icon { padding:5px; }
</style></head><body>
<div class="fixture-label">Paper-easy / 浏览器交互夹具 · 不是 Obsidian 实机截图</div>
<div class="workspace-leaf-content" data-type="pdf"><div class="view-actions"></div><div class="pdfViewer"><div class="page" data-page-number="1"><canvas width="600" height="620"></canvas><div class="textLayer"><h1>Reading becomes understanding.</h1><span id="passage">A good annotation preserves the evidence and makes it easy to return to the source.</span><p>Read. Select. Annotate. Keep your ideas beside the paper.</p></div></div></div></div>
<aside id="sidebar"></aside>
<script type="module">
import PaperNotesPlugin from '/test-dist/plugin.js';
const pdf = { path:'Physics/Paper/Paper.pdf', basename:'Paper', extension:'pdf', stat:{ mtime:1 } };
const containerEl = document.querySelector('.workspace-leaf-content');
const leaf = { view:{ getViewType:()=> 'pdf', containerEl, viewer:{ child:{ pdfViewer:{ pdfViewer:{getPageView:()=>({viewport:{ width:600, height:620, convertToPdfPoint:(x,y)=>[x,620-y] }})} } } } }, getViewState:()=>({ state:{file:pdf.path} }) };
const callbacks = {};
const app = { workspace: { getLeavesOfType:type=> type==='pdf'?[leaf]:[], on:(name,fn)=>{callbacks[name]=fn; return fn;}, onLayoutReady:fn=>fn(), getActiveFile:()=>pdf, detachLeavesOfType(){} }, metadataCache:{on:()=>{}, getFileCache:()=>({}), getFirstLinkpathDest:()=>pdf }, vault: { adapter:{}, on:()=>{}, getFileByPath:path=>path===pdf.path?pdf:null, getMarkdownFiles:()=>[] } };
const plugin = new PaperNotesPlugin(app); await plugin.onload();
window.fixture={plugin,leaf,pdf,callbacks};
window.selectPassage = () => {
  const range=document.createRange(); range.selectNodeContents(document.querySelector('#passage'));
  window.getSelection().removeAllRanges(); window.getSelection().addRange(range);
  return plugin.readPdfSelection(pdf);
};
window.fixture.selection=window.selectPassage();
plugin.getAnnotationIndex=async()=>[
 {id:'ai4d-a',type:'quote',page:1,text:'The evidence is preserved. — 证据会被保存。',notePath:'Physics/Paper.md',pdfPath:pdf.path,paperTitle:'Paper'},
 {id:'ai4d-b',type:'comment',page:3,text:'同名论文属于另一个学科。',notePath:'Math/Paper.md',pdfPath:'Math/Paper.pdf',paperTitle:'Paper'}
];
const sidebar=plugin.views['ai4d-annotation-sidebar']({app,detach(){document.querySelector('#sidebar').hidden=true;}});
await sidebar.onOpen(); document.querySelector('#sidebar').append(sidebar.contentEl); window.fixture.sidebar=sidebar;
plugin.showPdfSelectionTrigger(window.fixture.selection,{x:170,y:285});
window.fixture.ready=true;
</script></body></html>
